    get:
      summary: 共有タイムライン取得（テナント内の全公開エントリ）
      description: is_public=true のエントリのみが返却される。CloudFront でエッジキャッシュされる（s-maxage=30, stale-while-revalidate=60）。SP-U02-04
        8層防御で is_public=false の漏えいを物理的に防ぐ。
      tags:
        - Journal (Public)
      security:
        - &a2
          cookieAuth: []
      parameters:
        - schema:
            type: integer
            minimum: 1
            default: 1
            example: 1
          required: false
          name: page
          in: query
        - schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 50
            example: 50
          required: false
          name: perPage
          in: query
