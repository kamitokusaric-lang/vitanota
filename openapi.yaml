      summary: タスクボードのフィルタ設定を保存（UPSERT）
      tags:
        - Task
      security:
        - *a2
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                filterOwner:
                  type:
                    - string
                    - "null"
                filterTagIds:
                  type: array
                  items:
                    type: string
                filterCategoryIds:
                  type: array
                  items:
                    type: string
                showDelegated:
                  type: boolean
                period:
                  oneOf:
                    - type: object
                      properties:
                        mode:
                          type: string
                          enum:
                            - default
                      required:
                        - mode
                    - type: object
                      properties:
                        mode:
                          type: string
                          enum:
                            - range
                        from:
                          type: string
                          pattern: ^\d{4}-\d{2}-\d{2}$
                        to:
                          type: string
                          pattern: ^\d{4}-\d{2}-\d{2}$
                      required:
                        - mode
                        - from
                        - to
              required:
                - filterOwner
                - filterTagIds
                - filterCategoryIds
                - showDelegated
                - period
      responses:
        "200":
          description: 保存成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "400":
          description: バリデーションエラー
