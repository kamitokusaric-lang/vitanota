      tags:
        - Staffroom
      security:
        - *a2
      parameters:
        - schema:
            type: string
            enum:
              - keep
              - concern
              - thanks
              - help
              - knowledge
              - tweet
          required: false
          name: boardKind
          in: query
        - schema:
            type: string
          required: false
          name: classId
          in: query
        - schema:
            type: string
            pattern: ^\d{4}-\d{2}-\d{2}$
          required: false
          name: from
          in: query
        - schema:
            type: string
            pattern: ^\d{4}-\d{2}-\d{2}$
          required: false
          name: to
          in: query
        - schema:
            type: integer
            minimum: 1
            maximum: 100
          required: false
          name: limit
          in: query
        - schema:
            type:
              - integer
              - "null"
            minimum: 0
          required: false
          name: offset
          in: query
